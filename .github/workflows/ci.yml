# Workflows de CI/CD para ARGOS backend (ARCHITECTURE.md seccion 1).
# Jobs: lint/formato, pruebas (unitarias + integracion) y build de la imagen.

name: CI

on:
  push:
    branches: [main, dev/**]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15

      # `run` no revisa el formato: `fmt --diff` falla si gofumpt/goimports
      # cambiarian algun archivo.
      - name: Formato
        run: docker run --rm -v "$PWD:/src" -w /src golangci/golangci-lint:v2.15.0 golangci-lint fmt --diff

  test:
    name: Tests
    runs-on: ubuntu-latest
    # Los runners de GitHub (ubuntu-latest) ya incluyen Docker, asi que
    # Testcontainers levanta el PostgreSQL efimero sin configuracion extra.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet -tags=integration ./...

      - name: go test
        run: go test -race -count=1 -tags=integration ./...

  build:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker build -f docker/Dockerfile -t argos-backend:ci .
