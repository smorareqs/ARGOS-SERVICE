# Workflows de CI/CD para ARGOS backend (ARCHITECTURE.md seccion 1).
# Jobs: linting/formatting, type-checking, testing.

name: CI

on:
  push:
    branches: [main, dev/**]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pipx install poetry==1.8.4

      - name: Configure Poetry
        run: poetry config virtualenvs.in-project true

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-root

      - name: Ruff lint
        run: poetry run ruff check src tests

      - name: Ruff format check
        run: poetry run ruff format --check src tests

      - name: MyPy
        run: poetry run mypy src

  test:
    name: Tests
    runs-on: ubuntu-latest
    # Los runners de GitHub (ubuntu-latest) ya incluyen Docker, asi que
    # Testcontainers levanta el PostgreSQL efimero sin configuracion extra.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pipx install poetry==1.8.4

      - name: Configure Poetry
        run: poetry config virtualenvs.in-project true

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-root

      - name: Pytest
        run: poetry run pytest
