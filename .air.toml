# Hot-reload para desarrollo (docker/Dockerfile.dev): recompila y reinicia
# `argos serve` al cambiar archivos .go o .sql.
root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/argos ./cmd/argos"
entrypoint = ["./tmp/argos"]
args_bin = ["serve"]
include_ext = ["go", "sql"]
exclude_dir = ["tmp", "docker", "docs", ".github"]
exclude_regex = ["_test\\.go$"]
# Los bind mounts desde Windows no propagan eventos de archivos al contenedor.
poll = true
poll_interval = 500
delay = 300
stop_on_error = true

[misc]
clean_on_exit = true
