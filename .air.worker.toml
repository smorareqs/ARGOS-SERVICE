# Hot-reload del worker (docker-compose servicio `worker`). Compila a su propia
# carpeta para no pisar el binario de la API mientras ambos recargan.
root = "."
tmp_dir = "tmp/worker"

[build]
cmd = "go build -o ./tmp/worker/argos ./cmd/argos"
entrypoint = ["./tmp/worker/argos"]
args_bin = ["worker"]
include_ext = ["go", "sql", "html", "txt"]
exclude_dir = ["tmp", "docker", "docs", ".github"]
exclude_regex = ['_test[.]go$']
poll = true
poll_interval = 500
delay = 300
stop_on_error = true

[misc]
clean_on_exit = true
