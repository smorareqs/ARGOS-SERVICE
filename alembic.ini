# Configuracion de Alembic para migraciones de PostgreSQL.
# La URL real se inyecta dinamicamente desde src/core/config.py en migrations/env.py
# (ARCHITECTURE.md prohibe .env.example y exige configuracion segun el entorno).

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# sqlalchemy.url se define en migrations/env.py a partir de Settings.
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
