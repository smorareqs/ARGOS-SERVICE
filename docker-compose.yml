# Entorno de desarrollo local: PostgreSQL + migraciones + API con hot-reload.
# Las variables sensibles se inyectan por entorno (no hay .env.example).

# Variables comunes de migrate y api. Credenciales y secreto desde el .env
# (Compose lo lee automaticamente); ${VAR:?msg} hace fallar el `up` si falta.
# Dentro de la red de Docker el host es `db` y el puerto el interno 5432.
x-argos-env: &argos-env
  ARGOS_ENVIRONMENT: local
  ARGOS_DEBUG: "true"
  ARGOS_POSTGRES_HOST: db
  ARGOS_POSTGRES_PORT: "5432"
  ARGOS_POSTGRES_USER: ${ARGOS_POSTGRES_USER:?define ARGOS_POSTGRES_USER en .env}
  ARGOS_POSTGRES_PASSWORD: ${ARGOS_POSTGRES_PASSWORD:?define ARGOS_POSTGRES_PASSWORD en .env}
  ARGOS_POSTGRES_DB: ${ARGOS_POSTGRES_DB:?define ARGOS_POSTGRES_DB en .env}
  ARGOS_SECRET_KEY: ${ARGOS_SECRET_KEY:?define ARGOS_SECRET_KEY en .env}
  # Enlaces de los correos (invitaciones, contrasena) apuntan a la web local.
  ARGOS_WEB_BASE_URL: http://localhost:4200
  # S3 local: RustFS. La API habla con rustfs:9000 dentro de Docker y firma las
  # URLs con localhost:9000, que es como lo ve el navegador.
  ARGOS_S3_BUCKET: argos-local
  ARGOS_S3_ENDPOINT_URL: http://rustfs:9000
  ARGOS_S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
  ARGOS_S3_ACCESS_KEY: ${ARGOS_S3_ACCESS_KEY:?define ARGOS_S3_ACCESS_KEY en .env}
  ARGOS_S3_SECRET_KEY: ${ARGOS_S3_SECRET_KEY:?define ARGOS_S3_SECRET_KEY en .env}
  # Los correos no se envian: quedan en el log del worker y en tmp/mail/*.html.
  ARGOS_MAIL_DRIVER: log

x-argos-dev: &argos-dev
  build:
    context: .
    dockerfile: docker/Dockerfile.dev
  image: argos-api-dev
  environment: *argos-env
  volumes:
    - .:/app
    - go_mod_cache:/go/pkg/mod
    - go_build_cache:/root/.cache/go-build

services:
  db:
    image: postgres:16-alpine
    container_name: argos-db
    environment:
      POSTGRES_USER: ${ARGOS_POSTGRES_USER:?define ARGOS_POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${ARGOS_POSTGRES_PASSWORD:?define ARGOS_POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${ARGOS_POSTGRES_DB:?define ARGOS_POSTGRES_DB en .env}
    ports:
      # Host 5433 -> contenedor 5432. El 5432 del host lo ocupa un PostgreSQL
      # nativo de Windows; este mapeo evita el conflicto. Conectarse desde
      # herramientas externas (DataGrip, psql) usando localhost:5433.
      - "5433:5432"
    volumes:
      - argos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ARGOS_POSTGRES_USER} -d ${ARGOS_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Aplica las migraciones (shared y todos los tenants) y termina.
  migrate:
    <<: *argos-dev
    container_name: argos-migrate
    depends_on:
      db:
        condition: service_healthy
    command: ["go", "run", "./cmd/argos", "migrate", "up"]

  # Emulador S3 (solo desarrollo; en despliegue es Amazon S3). Consola en
  # http://localhost:9001 con las claves del .env.
  rustfs:
    image: rustfs/rustfs:1.0.5
    container_name: argos-rustfs
    environment:
      RUSTFS_ACCESS_KEY: ${ARGOS_S3_ACCESS_KEY:?define ARGOS_S3_ACCESS_KEY en .env}
      RUSTFS_SECRET_KEY: ${ARGOS_S3_SECRET_KEY:?define ARGOS_S3_SECRET_KEY en .env}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CORS_ALLOWED_ORIGINS: "*"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - argos_s3data:/data

  api:
    <<: *argos-dev
    container_name: argos-api
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rustfs:
        condition: service_started
    ports:
      - "8000:8000"

  # Cola de trabajos: correos (invitaciones, contrasenas) y limpieza de
  # archivos. Hot-reload con su propia config de air.
  worker:
    <<: *argos-dev
    container_name: argos-worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      rustfs:
        condition: service_started
    command: ["air", "-c", ".air.worker.toml"]

  # Empresas y cuentas de demostracion (argos seed demo-tenant). Idempotente:
  # en cada `up` deja las cuentas con la contrasena de ARGOS_SEED_PASSWORD.
  # Solo desarrollo: el comando se niega a correr con ARGOS_ENVIRONMENT=production.
  seed:
    <<: *argos-dev
    container_name: argos-seed
    environment:
      <<: *argos-env
      ARGOS_SEED_PASSWORD: ${ARGOS_SEED_PASSWORD:-Argos.2026}
      # Cuenta personal opcional (administrador en todas las empresas de demo).
      # Se define en el .env local; si falta el correo o la contrasena, no se crea.
      ARGOS_SEED_DEV_EMAIL: ${ARGOS_SEED_DEV_EMAIL:-}
      ARGOS_SEED_DEV_NAME: ${ARGOS_SEED_DEV_NAME:-}
      ARGOS_SEED_DEV_PASSWORD: ${ARGOS_SEED_DEV_PASSWORD:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["go", "run", "./cmd/argos", "seed", "demo-tenant"]

# Nombres fijos: los mismos volumenes se usan al levantar este compose solo o
# incluido desde WEB/docker-compose.yml (pila completa).
volumes:
  argos_pgdata:
    name: backend_argos_pgdata
  argos_s3data:
    name: argos_s3data
  go_mod_cache:
    name: argos_go_mod_cache
  go_build_cache:
    name: argos_go_build_cache
